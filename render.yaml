services:
  - type: web
    name: stockroom-nigeria
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: DB_PATH
        value: /opt/render/project/src/data/stockroom.db
    disk:
      name: stockroom-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1